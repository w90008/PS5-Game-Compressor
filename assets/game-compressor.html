<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ضاغط الألعاب</title>
  <script>
    (function () {
      var match = document.cookie.match(/(?:^|;\s*)game_compressor_theme=([^;]*)/);
      var theme = '';
      try {
        theme = match ? decodeURIComponent(match[1]) : '';
      } catch (err) {
        theme = '';
      }
      theme = theme === 'dark' ? 'dark' : 'light';
      window.__gcInitialTheme = theme;
      document.documentElement.classList.add(theme === 'dark' ? 'theme-dark' : 'theme-light');
    })();
  </script>
  <style>
    /* الأنماط كما هي - لم يتم تغييرها */
    :root {
      --bg: #f6f8fc;
      --surface: rgba(255, 255, 255, .82);
      --surface-solid: #ffffff;
      --surface-2: #edf3fb;
      --line: rgba(31, 47, 78, .12);
      --text: #111827;
      --muted: #697588;
      --accent: #1769ff;
      --accent-2: #6d8dff;
      --danger: #d84c5b;
      --focus: #1f6fff;
      --shadow: rgba(37, 51, 81, .16);
      --soft-shadow: 0 18px 46px rgba(39, 54, 84, .10);
      --button-shadow: 0 18px 42px rgba(23, 105, 255, .24);
      --app-bg: linear-gradient(145deg, #ffffff 0%, #f3f7ff 42%, #f8fbff 100%);
      --control-bg: rgba(255, 255, 255, .64);
      --path-bg: rgba(255, 255, 255, .52);
      --panel-bg: rgba(255, 255, 255, .68);
      --modal-bg: rgba(255, 255, 255, .92);
      --menu-bg: rgba(255, 255, 255, .94);
      --row-hover-bg: rgba(255, 255, 255, .72);
      --row-output-bg: rgba(234, 242, 255, .52);
      --menu-hover-bg: #eef4ff;
      --selected-bg: #eef4ff;
      --bar-bg: #dfe7f4;
      --progress-bg: #f4f5f7;
      --progress-text: #374151;
      --thumb-bg: linear-gradient(145deg, #eef4ff, #dce8fb);
    }

    html.theme-dark,
    body.theme-dark {
      --bg: #101313;
      --surface: rgba(25, 28, 28, .96);
      --surface-solid: #202424;
      --surface-2: #171a1a;
      --line: rgba(240, 245, 240, .11);
      --text: #f1f0eb;
      --muted: #aaa8a1;
      --accent: #2b86bd;
      --accent-2: #1d5f8c;
      --danger: #f06a78;
      --focus: #2b86bd;
      --shadow: rgba(0, 0, 0, .50);
      --soft-shadow: 0 16px 38px rgba(0, 0, 0, .30);
      --button-shadow: 0 18px 42px rgba(20, 103, 151, .25);
      --app-bg: #101313;
      --control-bg: rgba(35, 38, 38, .90);
      --path-bg: rgba(24, 27, 27, .84);
      --panel-bg: rgba(31, 34, 34, .88);
      --modal-bg: rgba(24, 27, 27, .98);
      --menu-bg: rgba(25, 28, 28, .98);
      --row-hover-bg: rgba(42, 46, 46, .78);
      --row-output-bg: rgba(245, 245, 240, .055);
      --menu-hover-bg: rgba(43, 134, 189, .14);
      --selected-bg: rgba(48, 53, 53, .72);
      --bar-bg: #2b3030;
      --progress-bg: #171a1a;
      --progress-text: #e8e6df;
      --thumb-bg: linear-gradient(145deg, #232727, #171a1a);
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Avenir Next", "Segoe UI", sans-serif;
      font-size: 15px;
      letter-spacing: 0;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button {
      font: inherit;
      color: inherit;
      border: 0;
      background: none;
    }

    button:focus-visible {
      outline: 3px solid rgba(31, 111, 255, .28);
      outline-offset: 3px;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(320px, min(40vw, 450px)) minmax(0, 1fr);
      height: 100%;
      min-height: 0;
      padding: 18px;
      gap: 18px;
      background: var(--app-bg);
    }

    .app.is-terminated {
      grid-template-columns: 1fr;
      place-items: center;
      padding: 0;
      gap: 0;
    }

    .icon-btn {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      color: var(--muted);
      cursor: pointer;
    }

    .icon-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .sidebar {
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--surface);
      box-shadow: var(--soft-shadow);
      overflow: hidden;
      backdrop-filter: blur(22px);
    }

    .sidebar-head {
      padding: 24px 22px 16px;
      border-bottom: 1px solid var(--line);
    }

    .sidebar-head h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 760;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .sidebar-brand {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }

    .sidebar-version {
      color: var(--muted);
      font-size: 12px;
      font-weight: 680;
      line-height: 1.2;
    }

    .sidebar-meta {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .game-list {
      min-height: 0;
      overflow: auto;
      padding: 12px;
    }

    body.has-open-modal .game-list,
    body.has-open-modal .detail,
    body.has-open-modal .secondary-menu {
      overflow: hidden;
    }

    body.has-open-modal .game-list::-webkit-scrollbar,
    body.has-open-modal .detail::-webkit-scrollbar,
    body.has-open-modal .secondary-menu::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    .game-row {
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      position: relative;
      width: 100%;
      min-height: 86px;
      padding: 12px;
      border-radius: 22px;
      cursor: pointer;
      text-align: right;
      color: var(--text);
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
    }

    .game-row:hover {
      transform: translateY(-1px);
      background: var(--row-hover-bg);
    }

    .game-row:active {
      transform: scale(.985);
    }

    .game-row.is-selected {
      background: var(--surface-solid);
      box-shadow: 0 14px 34px rgba(37, 51, 81, .12);
    }

    body.theme-dark .game-row.is-selected {
      background: var(--selected-bg);
      box-shadow: inset 0 0 0 1px rgba(240, 245, 240, .075), 0 12px 28px rgba(0, 0, 0, .22);
    }

    .game-row.is-unmounted {
      opacity: .52;
    }

    .game-row.is-unmounted:hover,
    .game-row.is-unmounted.is-selected {
      opacity: .72;
    }

    .game-row.is-output {
      background: var(--row-output-bg);
    }

    .thumb,
    .hero-icon {
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 16px;
      background: var(--thumb-bg);
      color: var(--accent);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .92), 0 10px 24px rgba(37, 51, 81, .12);
    }

    .thumb {
      width: 54px;
      height: 54px;
      font-size: 11px;
      font-weight: 760;
      transition: transform .18s ease, box-shadow .18s ease;
      will-change: transform;
    }

    .game-row:hover .thumb {
      transform: translateY(-1px) scale(1.04);
    }

    .thumb img,
    .hero-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .row-main {
      min-width: 0;
    }

    .row-title {
      min-width: 0;
      font-size: 15px;
      font-weight: 720;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-sub {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .row-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 7px;
      padding-right: 90px;
    }

    .row-tag {
      display: inline-flex;
      align-items: center;
      max-width: 100%;
      height: 18px;
      padding: 0 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--control-bg);
      color: var(--muted);
      font-size: 10px;
      font-weight: 560;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: lowercase;
    }

    .row-tag.is-apr {
      color: #155f8c;
      border-color: rgba(43, 134, 189, .24);
      background: #e7f4fb;
      text-transform: none;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 24px;
      padding: 0 9px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--control-bg);
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
      white-space: nowrap;
      text-transform: lowercase;
    }

    .game-row>.chip {
      position: absolute;
      left: 12px;
      right: auto;
      bottom: 12px;
      height: 22px;
      max-width: calc(100% - 24px);
      padding: 0 8px;
      font-size: 10px;
      justify-self: start;
    }

    .chip.metric {
      min-width: 78px;
      text-align: center;
      text-transform: none;
    }

    .chip.size-estimate {
      min-width: 72px;
    }

    .chip.ok {
      color: #14895b;
      border-color: rgba(20, 137, 91, .20);
      background: #eaf8f1;
    }

    .chip.warn {
      color: #a56a05;
      border-color: rgba(165, 106, 5, .18);
      background: #fff5dd;
    }

    .chip.ampr {
      color: #b94708;
      border-color: rgba(217, 91, 18, .22);
      background: #fff1df;
      text-transform: none;
    }

    .chip.ampr-version {
      color: #155f8c;
      border-color: rgba(43, 134, 189, .24);
      background: #e7f4fb;
      text-transform: none;
    }

    .chip.selected,
    .chip.validating,
    .chip.reading,
    .chip.compressing {
      color: #155f8c;
      border-color: rgba(43, 134, 189, .28);
      background: #e7f4fb;
      text-transform: none;
    }

    .chip.ampr-updating {
      color: #fff;
      border-color: transparent;
      background: linear-gradient(135deg, #df4f12, #f59f1b);
      box-shadow: 0 10px 22px rgba(223, 79, 18, .22);
    }

    .chip.run {
      color: #0d5bdd;
      border-color: rgba(19, 102, 255, .20);
      background: #eaf2ff;
    }

    .chip.bad {
      color: #bc3047;
      border-color: rgba(216, 76, 91, .18);
      background: #fff0f2;
    }

    .chip.closing {
      color: #5b6472;
      border-color: rgba(91, 100, 114, .22);
      background: #edf1f5;
    }

    .chip.mounting {
      color: #216b8f;
      border-color: rgba(33, 107, 143, .22);
      background: #e8f5fb;
    }

    .chip.scanning {
      color: #386176;
      border-color: rgba(56, 97, 118, .22);
      background: #e9f4f8;
    }

    .chip.repacking {
      color: #8a5b0d;
      border-color: rgba(168, 112, 12, .22);
      background: #fff4d8;
    }

    .chip.moving {
      color: #386176;
      border-color: rgba(56, 97, 118, .22);
      background: #e9f4f8;
    }

    .chip.finalizing {
      color: #59616d;
      border-color: rgba(89, 97, 109, .22);
      background: #eef1f5;
    }

    .chip.restoring {
      color: #6b4ba1;
      border-color: rgba(107, 75, 161, .22);
      background: #f0ebff;
    }

    .chip.unpacking {
      color: #6b4ba1;
      border-color: rgba(107, 75, 161, .22);
      background: #f0ebff;
    }

    .chip.size-pending {
      min-width: 96px;
      gap: 0;
      color: #386176;
      border-color: rgba(56, 97, 118, .18);
      background: #edf7fa;
    }

    body.theme-dark .chip {
      border-color: rgba(245, 245, 240, .10);
      background: rgba(39, 39, 41, .80);
      color: #aeada6;
    }

    body.theme-dark .chip.ok {
      color: #9ee6bd;
      border-color: rgba(110, 231, 183, .20);
      background: rgba(34, 105, 73, .22);
    }

    body.theme-dark .chip.warn {
      color: #f2c879;
      border-color: rgba(242, 200, 121, .20);
      background: rgba(125, 86, 28, .22);
    }

    body.theme-dark .chip.ampr,
    body.theme-dark .chip.ampr-updating {
      color: #ffd0a3;
      border-color: rgba(245, 158, 91, .24);
      background: rgba(154, 73, 27, .24);
      box-shadow: none;
    }

    body.theme-dark .chip.ampr-version {
      color: #bfe8ff;
      border-color: rgba(98, 176, 221, .30);
      background: rgba(43, 134, 189, .18);
    }

    body.theme-dark .row-tag.is-apr {
      color: #bfe8ff;
      border-color: rgba(98, 176, 221, .30);
      background: rgba(43, 134, 189, .18);
    }

    body.theme-dark .chip.selected,
    body.theme-dark .chip.validating,
    body.theme-dark .chip.reading,
    body.theme-dark .chip.compressing {
      color: #bfe8ff;
      border-color: rgba(98, 176, 221, .34);
      background: rgba(43, 134, 189, .22);
    }

    body.theme-dark .chip.run {
      color: #c9e28d;
      border-color: rgba(201, 226, 141, .20);
      background: rgba(84, 107, 38, .22);
    }

    body.theme-dark .chip.bad {
      color: #ff9aa6;
      border-color: rgba(255, 154, 166, .22);
      background: rgba(135, 43, 56, .24);
    }

    body.theme-dark .chip.closing,
    body.theme-dark .chip.finalizing {
      color: #c4c2bc;
      border-color: rgba(196, 194, 188, .18);
      background: rgba(83, 83, 82, .24);
    }

    body.theme-dark .chip.mounting,
    body.theme-dark .chip.scanning,
    body.theme-dark .chip.moving,
    body.theme-dark .chip.size-pending {
      color: #a9d6ca;
      border-color: rgba(169, 214, 202, .20);
      background: rgba(49, 101, 87, .20);
    }

    body.theme-dark .chip.repacking {
      color: #f0cf83;
      border-color: rgba(240, 207, 131, .22);
      background: rgba(119, 86, 31, .24);
    }

    body.theme-dark .chip.restoring,
    body.theme-dark .chip.unpacking {
      color: #d4c3ff;
      border-color: rgba(212, 195, 255, .22);
      background: rgba(87, 65, 136, .24);
    }

    .measure-dots {
      display: inline-block;
      width: 18px;
      text-align: left;
    }

    button.chip {
      font-family: inherit;
      cursor: pointer;
    }

    button.chip:hover {
      filter: brightness(.98);
    }

    .content {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: 64px 1fr;
      border: 1px solid var(--line);
      border-radius: 32px;
      background: var(--surface);
      box-shadow: var(--soft-shadow);
      overflow: hidden;
      backdrop-filter: blur(22px);
    }

    .topbar {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
    }

    .topbar-actions {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .theme-tools {
      flex: 0 0 auto;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-toggle {
      flex: 0 0 auto;
      height: 44px;
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
      align-items: center;
      padding: 3px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: var(--control-bg);
      box-shadow: 0 8px 20px rgba(37, 51, 81, .08);
    }

    .theme-option {
      min-width: 42px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      color: var(--muted);
      cursor: pointer;
      transition: background .16s ease, color .16s ease, transform .16s ease;
    }

    .theme-option svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .theme-option.is-selected {
      color: #ffffff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 8px 18px rgba(23, 105, 255, .18);
    }

    .theme-option:not(.is-selected):hover {
      color: var(--accent);
      background: var(--menu-hover-bg);
      transform: translateY(-1px);
    }

    .terminate-reminder {
      position: absolute;
      top: calc(100% + 8px);
      right: 18px;
      z-index: 32;
      width: min(320px, calc(100vw - 36px));
      padding: 10px 12px;
      border: 1px solid rgba(31, 47, 78, .22);
      border-radius: 14px;
      background: var(--menu-bg);
      color: var(--text);
      font-size: 12px;
      line-height: 1.35;
      font-weight: 640;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .74),
        0 16px 36px rgba(37, 51, 81, .14);
      backdrop-filter: blur(18px);
      pointer-events: none;
      opacity: 1;
      transform: translateY(0);
      transition: opacity .18s ease, transform .18s ease;
    }

    .terminate-reminder.hidden {
      opacity: 0;
      transform: translateY(-4px);
    }

    .terminate-reminder::before {
      content: "";
      position: absolute;
      top: -6px;
      right: 19px;
      width: 10px;
      height: 10px;
      border-left: 1px solid rgba(31, 47, 78, .22);
      border-top: 1px solid rgba(31, 47, 78, .22);
      background: var(--menu-bg);
      transform: rotate(45deg);
    }

    .terminate-reminder strong {
      display: block;
      margin-bottom: 2px;
      font-size: 12px;
      font-weight: 760;
    }

    .terminate-reminder span {
      color: var(--muted);
      font-weight: 600;
    }

    .terminated-screen {
      width: min(520px, calc(100% - 40px));
      margin: auto;
      padding: 34px 28px;
      text-align: center;
    }

    .terminated-icon {
      width: 168px;
      height: 168px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border-radius: 46px;
      border: 1px solid rgba(216, 76, 91, .24);
      background: rgba(255, 240, 242, .92);
      color: var(--danger);
      box-shadow: 0 24px 60px rgba(216, 76, 91, .18);
    }

    .terminated-icon svg {
      width: 82px;
      height: 82px;
      stroke: currentColor;
      stroke-width: 2.15;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .terminated-title {
      margin: 0 0 8px;
      color: var(--text);
      font-size: 24px;
      line-height: 1.15;
      font-weight: 780;
    }

    .terminated-copy {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
      font-weight: 650;
    }

    .free-space-label {
      min-width: 0;
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      padding: 0 12px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--control-bg);
      color: var(--muted);
      font-size: 13px;
      font-weight: 680;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 8px 20px rgba(37, 51, 81, .08);
    }

    .free-space-label span {
      margin-left: 6px;
      color: var(--text);
    }

    .icon-btn {
      background: var(--control-bg);
      border: 1px solid var(--line);
      box-shadow: 0 8px 20px rgba(37, 51, 81, .08);
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
    }

    .icon-btn:hover {
      background: var(--surface-solid);
      color: var(--accent);
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(37, 51, 81, .12);
    }

    .icon-btn.is-danger:hover {
      color: var(--danger);
      border-color: rgba(216, 76, 91, .28);
    }

    .icon-btn.is-terminate-needed {
      color: #ffffff;
      border-color: rgba(190, 18, 60, .34);
      background: linear-gradient(180deg, #e11d48, #be123c);
      box-shadow: 0 0 0 1px rgba(190, 18, 60, .08),
        0 14px 30px rgba(190, 18, 60, .24);
    }

    .icon-btn.is-terminate-needed:hover {
      color: #ffffff;
      border-color: rgba(190, 18, 60, .48);
      background: linear-gradient(180deg, #f43f5e, #be123c);
      box-shadow: 0 0 0 1px rgba(190, 18, 60, .12),
        0 16px 34px rgba(190, 18, 60, .30);
    }

    .icon-btn:disabled {
      cursor: default;
      opacity: .48;
      transform: none;
      box-shadow: none;
    }

    .info-launcher {
      position: fixed;
      right: 25px;
      bottom: 25px;
