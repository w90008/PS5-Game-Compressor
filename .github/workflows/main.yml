
name: Build PS5 Game Compressor

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            clang \
            llvm \
            lld \
            xxd \
            unzip \
            wget \
            curl \
            python3 \
            pkg-config

      - name: Download PS5 Payload SDK
        run: |
          wget -O sdk.tar.gz https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.tar.gz
          sudo tar -xzf sdk.tar.gz -C /

      - name: Build
        run: |
          export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
          make

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: game-compressor
          path: |
            *.elf
            build/**/*.elf
