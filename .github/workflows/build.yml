name: Build PS5 Game Compressor

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bash \
            build-essential \
            clang-18 \
            lld-18 \
            llvm-18 \
            wget \
            unzip \
            xxd \
            python3 \
            python3-pyelftools \
            pkg-config \
            zlib1g-dev \
            cmake \
            meson \
            socat

      - name: Download PS5 Payload SDK
        run: |
          wget https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
          sudo unzip -q ps5-payload-sdk.zip -d /opt

      - name: Verify SDK
        run: |
          ls -la /opt
          ls -la /opt/ps5-payload-sdk
          test -f /opt/ps5-payload-sdk/toolchain/prospero.mk

      - name: Build
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
          CC: clang-18
          CXX: clang++-18
        run: |
          echo "PS5_PAYLOAD_SDK=$PS5_PAYLOAD_SDK"
          make clean || true
          make -j$(nproc)

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: game-compressor
          path: game-compressor.elf
